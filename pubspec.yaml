name: iron_byte
description: Iron Byte agency marketing site and consultation flows (Flutter).
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bloc: ^9.1.0
  go_router: ^17.2.0
  url_launcher: ^6.3.1
  gap: ^3.0.1
  easy_localization: ^3.0.8
  file_picker: ^11.0.2
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  freezed: ^3.2.5
  path: ^1.9.1
  http: ^1.6.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/pictures/members/
    - assets/images/pictures/language_kit/
    - assets/images/pictures/migrane_app/
    - assets/images/pictures/numis_ai/
    - assets/images/pictures/symptom_tracker/
    - assets/images/pictures/vibe_kit/
    - assets/data/portfolio_project_order.json

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/roboto/Roboto-Italic-VariableFont_wdth,wght.ttf

    - family: DMSans
      fonts:
        - asset: assets/fonts/dm_sans/DMSans-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/dm_sans/DMSans-Italic-VariableFont_opsz,wght.ttf

    - family: Montserrat
      fonts:
        - asset: assets/fonts/monserrat/Montserrat-VariableFont_wght.ttf
        - asset: assets/fonts/monserrat/Montserrat-Italic-VariableFont_wght.ttf

    - family: Syne
      fonts:
        - asset: assets/fonts/syne/Syne-VariableFont_wght.ttf

    - family: Cinzel
      fonts:
        - asset: assets/fonts/cinzel/Cinzel-VariableFont_wght.ttf

    - family: PlayFair
      fonts:
        - asset: assets/fonts/playfair/Playfair-VariableFont_opsz,wdth,wght.ttf
        - asset: assets/fonts/playfair/Playfair-Italic-VariableFont_opsz,wdth,wght.ttf
